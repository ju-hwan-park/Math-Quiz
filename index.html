<script>
// ============================================================================
// Firebase 연동 (GitHub Pages 등 Claude 밖에서 실행될 때만 작동)
// ============================================================================
// Claude 아티팩트 안에서는 window.storage가 이미 준비되어 있어서 이 블록은
// 아무것도 하지 않습니다. GitHub Pages처럼 window.storage가 없는 곳에서 열리면
// 아래 firebaseConfig를 채운 뒤, Firestore를 대신 storage로 사용합니다.
//
// ▶ 설정 방법 (처음 한 번만):
//   1) https://console.firebase.google.com 에서 새 프로젝트 만들기 (무료)
//   2) 왼쪽 메뉴 "Firestore Database" → "데이터베이스 만들기" → 테스트 모드로 시작
//   3) 프로젝트 설정(톱니바퀴) → "내 앱" → 웹 앱 추가(</>) → 아래 firebaseConfig에
//      나오는 값을 그대로 복사해서 아래 객체에 붙여넣기
//   4) Firestore "규칙" 탭에서 아래 규칙으로 저장 (학급용 간단 규칙):
//        rules_version = '2';
//        service cloud.firestore {
//          match /databases/{database}/documents {
//            match /quizAppKV/{docId} {
//              allow read, write: if true;
//            }
//          }
//        }
if (!window.storage) {
  const firebaseConfig = {
    apiKey: "AIzaSyCsX57Td_Rcn-NEsaXW2AqCn7mP3qe-zWQ",
    authDomain: "archive-60d1d.firebaseapp.com",
    projectId: "archive-60d1d",
    storageBucket: "archive-60d1d.firebasestorage.app",
    messagingSenderId: "619398518185",
    appId: "1:619398518185:web:614a55d23ec0bf2a06a0b8"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const KV = 'quizAppKV';
  const FieldPath = firebase.firestore.FieldPath;
  // Firestore 문서 하나는 1MiB(약 1,048,576바이트) 제한이 있어서, 값이 크면
  // (그래프 이미지가 많은 문제 파일 등) 여러 조각으로 나눠 저장하고 읽을 때 합칩니다.
  const CHUNK_SIZE = 700000; // 안전 마진을 둔 조각 크기(문자 수 기준)

  function splitSafely(str, maxLen) {
    const chunks = [];
    let i = 0;
    while (i < str.length) {
      let end = Math.min(i + maxLen, str.length);
      if (end < str.length) {
        const code = str.charCodeAt(end - 1);
        if (code >= 0xD800 && code <= 0xDBFF) end -= 1; // 서로게이트 쌍 중간에서 자르지 않기
      }
      chunks.push(str.slice(i, end));
      i = end;
    }
    return chunks;
  }
  async function deleteOldChunks(key) {
    const snap = await db.collection(KV).orderBy(FieldPath.documentId())
      .startAt(key + '__chunk').endAt(key + '__chunk\uf8ff').get();
    if (snap.empty) return;
    const batch = db.batch();
    snap.docs.forEach(d => batch.delete(d.ref));
    await batch.commit();
  }

  window.storage = {
    async get(key) {
      const doc = await db.collection(KV).doc(key).get();
      if (!doc.exists) throw new Error('Key not found: ' + key);
      const data = doc.data();
      if (!data.chunked) return { key, value: data.value, shared: true };
      const chunkDocs = await Promise.all(
        Array.from({ length: data.count }, (_, i) => db.collection(KV).doc(`${key}__chunk${i}`).get())
      );
      const value = chunkDocs.map(d => d.data().part).join('');
      return { key, value, shared: true };
    },
    async set(key, value) {
      await deleteOldChunks(key);
      if (value.length <= CHUNK_SIZE) {
        await db.collection(KV).doc(key).set({ chunked: false, value });
      } else {
        const parts = splitSafely(value, CHUNK_SIZE);
        const batch = db.batch();
        batch.set(db.collection(KV).doc(key), { chunked: true, count: parts.length });
        parts.forEach((part, i) => batch.set(db.collection(KV).doc(`${key}__chunk${i}`), { part }));
        await batch.commit();
      }
      return { key, value, shared: true };
    },
    async delete(key) {
      await deleteOldChunks(key);
      await db.collection(KV).doc(key).delete();
      return { key, deleted: true, shared: true };
    },
    async list(prefix) {
      const snap = await db.collection(KV).orderBy(FieldPath.documentId())
        .startAt(prefix).endAt(prefix + '\uf8ff').get();
      const keys = snap.docs.map(d => d.id).filter(id => !/__chunk\d+$/.test(id));
      return { keys, prefix, shared: true };
    }
  };
}
</script>

let state = { view: 'login' };

// ---------- 커스텀 모달 (샌드박스 환경에서 alert/confirm/prompt가 막혀 있어 자체 구현) ----------
function showModal({ message, isPrompt=false, isPassword=false, okText='확인', cancelText='취소', showCancel=true }) {
  return new Promise((resolve) => {
    const overlay = document.getElementById('modalOverlay');
    const msgEl = document.getElementById('modalMessage');
    const inputEl = document.getElementById('modalInput');
    const errEl = document.getElementById('modalErr');
    const okBtn = document.getElementById('modalOkBtn');
    const cancelBtn = document.getElementById('modalCancelBtn');

    msgEl.textContent = message;
    errEl.style.display = 'none';
    errEl.textContent = '';
    inputEl.style.display = isPrompt ? 'block' : 'none';
    inputEl.type = isPassword ? 'password' : 'text';
    inputEl.value = '';
    okBtn.textContent = okText;
    cancelBtn.style.display = showCancel ? 'block' : 'none';
    cancelBtn.textContent = cancelText;
    overlay.style.display = 'flex';
    if (isPrompt) setTimeout(() => inputEl.focus(), 30);
    else okBtn.focus();

    function cleanup() {
      overlay.style.display = 'none';
      okBtn.onclick = null; cancelBtn.onclick = null; inputEl.onkeydown = null;
    }
    okBtn.onclick = () => {
      cleanup();
      resolve(isPrompt ? inputEl.value : true);
    };
    cancelBtn.onclick = () => {
      cleanup();
      resolve(isPrompt ? null : false);
    };
    if (isPrompt) {
      inputEl.onkeydown = (e) => { if (e.key === 'Enter') okBtn.click(); };
    }
  });
}
function showAlert(message) {
  return showModal({ message, showCancel: false });
}
function showConfirm(message) {
  return showModal({ message, okText: '확인', cancelText: '취소' });

// ---------- 저장소 호출 도우미: 동시 요청 수 제한 + 일시적 오류 재시도 ----------
// 배치가 많아진 상태에서 한 번에 수십~수백 개의 요청을 동시에 보내면
// "Internal server error while processing action" 같은 일시적인 오류가 나기 쉽습니다.
// 동시 실행 개수를 제한하고, 실패하면 짧게 기다렸다가 다시 시도합니다.
async function mapWithConcurrency(items, limit, fn) {
  const results = new Array(items.length);
  let idx = 0;
  async function worker() {
    while (idx < items.length) {
      const i = idx++;
      results[i] = await fn(items[i], i);
    }
  }
  const workerCount = Math.max(1, Math.min(limit, items.length));
  await Promise.all(Array.from({ length: workerCount }, worker));
  return results;
}
// 항목이 많을 때(예: 응시 기록 수백 건 복원) 소량씩(chunkSize개) 병렬로 처리하고,
// 묶음 사이에 짧게 쉬어서 요청이 한꺼번에 몰리는 것을 막습니다.
async function mapThrottled(items, chunkSize, delayMs, fn) {
  const results = [];
  for (let i = 0; i < items.length; i += chunkSize) {
    const chunk = items.slice(i, i + chunkSize);
    const chunkResults = await Promise.all(chunk.map(fn));
    results.push(...chunkResults);
    if (i + chunkSize < items.length) await new Promise(res => setTimeout(res, delayMs));
  }
  return results;
}
async function withRetry(fn, retries = 4, delayMs = 700) {
  let lastErr;
  for (let i = 0; i <= retries; i++) {
    try { return await fn(); }
    catch (e) {
      lastErr = e;
      if (i < retries) await new Promise(res => setTimeout(res, delayMs * Math.pow(2, i)));
    }
  }
  throw lastErr;
}

// ---------- storage helpers ----------
// 문제은행은 파일 업로드 배치 단위로 나눠서 저장합니다 (bank-batch:<해시>).
// 한 저장소 키의 값은 5MB로 제한되어 있어서, 전체 문제은행을 통째로 한 키에 저장하면
// 문제가 쌓일수록 용량 제한에 걸려 저장이 실패합니다. 배치별로 나누면 새로 업로드하는
// 파일 하나의 크기만 문제가 되고, 기존에 쌓인 데이터 크기는 영향을 주지 않습니다.
const BANK_BATCH_PREFIX = 'bank-batch:';

function batchKeyHash(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) { h = (Math.imul(31, h) + str.charCodeAt(i)) | 0; }
  return (h >>> 0).toString(36);
}
function batchStorageKey(batchKey) { return BANK_BATCH_PREFIX + batchKeyHash(batchKey); }

async function loadBank() {
  try {
    const list = await window.storage.list(BANK_BATCH_PREFIX, true);
    if (list && list.keys && list.keys.length > 0) {
      const results = await mapWithConcurrency(list.keys, 6, async k => {
        try {
          const r = await withRetry(() => window.storage.get(k, true));
          return r ? JSON.parse(r.value) : null;
        } catch(e) { console.error('배치 로딩 실패:', k, e); return null; }
      });
      let all = [];
      results.forEach(batch => { if (batch && Array.isArray(batch.questions)) all = all.concat(batch.questions); });
      return all;
    }
    // 예전 방식(단일 키)으로 저장된 데이터가 있으면 배치 단위로 자동 이전
    try {
      const legacy = await window.storage.get(BANK_KEY, true);
      if (legacy) {
        const legacyBank = JSON.parse(legacy.value);
        if (Array.isArray(legacyBank) && legacyBank.length > 0) {
          const ok = await saveBank(legacyBank);
          if (ok) { try { await window.storage.delete(BANK_KEY, true); } catch(e2) {} }
          return legacyBank;
        }
      }
    } catch(e3) { /* 예전 키 없음 - 정상 */ }
    return SEED_QUESTIONS;
  } catch(e) {
    console.error('loadBank 실패:', e);
    return SEED_QUESTIONS;
  }
}
function groupByBatch(qs) {
  const groups = {};
  qs.forEach(q => {
    const bk = batchKeyOf(q);
    if (!groups[bk]) groups[bk] = [];
    groups[bk].push(q);
  });
  return groups;
}
// prevQs(수정 전 문제은행 배열)를 함께 넘기면, 실제로 내용이 바뀐 배치만 다시 저장하고
// 나머지는 건드리지 않습니다. 문제가 많이 쌓인 상태에서 업로드/삭제 한 번 할 때마다
// 전체 배치를 매번 다시 쓰던 예전 방식보다 훨씬 빠릅니다. 저장/삭제도 동시 요청 수를
// 제한해서 처리하고(서버 과부하로 인한 일시적 오류 방지), 실패한 요청은 재시도합니다.
// prevQs를 넘기지 않으면(예: 백업 복원처럼 저장소 상태를 신뢰할 수 없을 때) 저장소를
// 직접 조회해서 안전하게 정리합니다.
async function saveBank(qs, prevQs) {
  try {
    const groups = groupByBatch(qs);
    const desiredKeys = Object.keys(groups);
    const desiredStorageKeys = new Set(desiredKeys.map(bk => batchStorageKey(bk)));

    let batchesToWrite = desiredKeys;
    let keysToDelete = [];

    if (Array.isArray(prevQs)) {
      const prevGroups = groupByBatch(prevQs);
      batchesToWrite = desiredKeys.filter(bk => {
        const prevJson = prevGroups[bk] ? JSON.stringify(prevGroups[bk]) : null;
        return prevJson !== JSON.stringify(groups[bk]);
      });
      keysToDelete = Object.keys(prevGroups)
        .filter(bk => !groups[bk])
        .map(bk => batchStorageKey(bk));
    } else {
      const existing = await window.storage.list(BANK_BATCH_PREFIX, true);
      const existingKeys = (existing && existing.keys) ? existing.keys : [];
      keysToDelete = existingKeys.filter(k => !desiredStorageKeys.has(k));
    }

    // 한 번에 여러 배치를 써야 할 때(백업 복원 등) 요청이 짧은 시간에 몰리면 저장소
    // 쪽에서 오류가 나는 경우가 있어, 배치 하나씩 순서대로 간격을 두고 저장합니다.
    // (배치 1개만 바뀐 일반적인 업로드/삭제/수정은 이 루프가 한 번만 돌아서 느려지지 않습니다.)
    const writeResults = [];
    for (const bk of batchesToWrite) {
      try {
        const r = await withRetry(() => window.storage.set(
          batchStorageKey(bk), JSON.stringify({ batchKey: bk, questions: groups[bk] }), true
        ));
        writeResults.push({ bk, ok: !!r });
      } catch(e) {
        console.error('배치 저장 실패:', bk, e);
        writeResults.push({ bk, ok: false, error: e });
      }
      if (batchesToWrite.length > 1) await new Promise(res => setTimeout(res, 350));
    }
    const failed = writeResults.filter(r => !r.ok);
    if (failed.length) {
      const labels = failed.map(f => {
        const q0 = groups[f.bk] && groups[f.bk][0];
        return q0 && q0.batchLabel ? q0.batchLabel : f.bk;
      });
      throw new Error(`다음 파일 저장에 실패했습니다: ${labels.join(', ')} (파일 하나의 용량이 너무 크거나, 일시적인 서버 오류일 수 있습니다. 잠시 후 다시 시도해보세요.)`);
    }
    for (const k of keysToDelete) {
      await window.storage.delete(k, true).catch(()=>{});
      if (keysToDelete.length > 1) await new Promise(res => setTimeout(res, 200));
    }

    return true;
  } catch(e) {
    console.error('saveBank 실패:', e);
    await showAlert('문제은행 저장에 실패했습니다: ' + (e && e.message ? e.message : e));
    return false;
  }
}

// ---- 전체 데이터 백업(내보내기) / 복원(가져오기) ----
// 코드를 고쳐서 새로 게시하면 저장소가 초기화되는 경우가 있어, 매번 과목·단원·학생 계정을
// 다시 만들지 않도록 전체 데이터를 파일 하나로 내보내고, 새로 게시한 뒤 그 파일을 그대로
// 불러와 복원할 수 있게 합니다.
async function buildFullBackup() {
  const [bank, meta, students, studentNotes, results, teacherAuth] = await Promise.all([
    loadBank(), loadMeta(), loadAllStudentAccounts(), loadStudentNotes(), loadAllResults(), getTeacherAuth()
  ]);
  const studentAuths = {};
  const authResults = await mapWithConcurrency(students, 6, name => getStudentAuth(name).then(a => [name, a]));
  authResults.forEach(([name, a]) => { if (a) studentAuths[name] = a.pin; });
  return {
    backupType: 'quiz-app-full-backup', version: 1, exportedAt: new Date().toISOString(),
    bank, meta, studentAuths, studentNotes, results,
    teacherPass: teacherAuth ? teacherAuth.pass : null
  };
}
async function restoreFullBackup(data) {
  const errors = [];
  if (Array.isArray(data.bank)) {
    const ok = await saveBank(data.bank);
    if (!ok) errors.push('문제은행 복원 실패');
  }
  if (data.meta && typeof data.meta === 'object') {
    const ok = await saveMeta(data.meta);
    if (!ok) errors.push('과목/단원 정보 복원 실패');
  }
  if (data.studentAuths && typeof data.studentAuths === 'object') {
    const results = await mapThrottled(Object.entries(data.studentAuths), 3, 300, ([name, pin]) =>
      withRetry(() => setStudentAuth(name, pin)).then(()=>true).catch(()=>name)
    );
    results.filter(r => r !== true).forEach(name => errors.push(`학생 계정 복원 실패: ${name}`));
  }
  if (data.studentNotes && typeof data.studentNotes === 'object') {
    try { await withRetry(() => window.storage.set(STUDENT_NOTES_KEY, JSON.stringify(data.studentNotes), true)); }
    catch(e) { errors.push('학생 메모 복원 실패'); }
  }
  if (Array.isArray(data.results)) {
    const results = await mapThrottled(data.results, 3, 300, r => {
      const key = RESULTS_PREFIX + r.name + ':' + (r.ts || Date.now());
      return withRetry(() => window.storage.set(key, JSON.stringify(r), true)).then(()=>true).catch(()=>false);
    });
    if (results.some(ok => !ok)) errors.push('일부 응시 기록 복원 실패');
  }
  if (data.teacherPass) {
    try { await setTeacherAuth(data.teacherPass); } catch(e) { errors.push('선생님 비밀번호 복원 실패'); }
  }
  return errors;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function renderMath() {
  if (window.renderMathInElement) {
    renderMathInElement(document.getElementById('app'), { delimiters: [{left:'$', right:'$', display:false}] });
  }
}
function groupCount(bank, keyFn) {
  const m = {};
  bank.forEach(q => { const k = keyFn(q); m[k] = (m[k]||0)+1; });
  return m;
}
// meta.__subjectOrder = 과목 표시 순서, meta[과목명] = 해당 과목의 단원 표시 순서
function getOrderedSubjects(bank, meta) {
  const order = meta.__subjectOrder || [];
  const fromBank = Object.keys(groupCount(bank, q => q.subject || '기타'));
  const fromMeta = Object.keys(meta).filter(k => k !== '__subjectOrder');
  const all = Array.from(new Set([...fromBank, ...fromMeta]));
  const known = order.filter(s => all.includes(s));
  const rest = all.filter(s => !known.includes(s));
  return [...known, ...rest];
}
function getOrderedUnits(bank, meta, subject) {
  const order = meta[subject] || [];
  const fromBank = Object.keys(groupCount(bank.filter(q => (q.subject||'기타')===subject), q => q.unit || '기타'));
  const all = Array.from(new Set([...fromBank, ...order]));
  const known = order.filter(u => all.includes(u));
  const rest = all.filter(u => !known.includes(u));
  return [...known, ...rest];
}
function fmtDateTime(ts) {
  if (!ts) return '-';
  const d = new Date(ts);
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function fmtDuration(sec) {
  if (sec === null || sec === undefined) return '-';
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec/60), s = sec%60;
  return m > 0 ? `${m}분 ${s}초` : `${s}초`;
}
function fmtClock(sec) {
  const m = Math.floor(sec/60), s = sec%60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function setupScratchCanvas(qid, imageUrl) {
  const canvas = document.getElementById('scratchCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const cssWidth = canvas.clientWidth || 300;
  const cssHeight = 260;
  canvas.width = Math.round(cssWidth * dpr);
  canvas.height = Math.round(cssHeight * dpr);
  canvas.style.height = cssHeight + 'px';
  ctx.scale(dpr, dpr);
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  const saved = state.notes && state.notes[qid];
  if (saved) {
    const img = new Image();
    img.onload = () => { ctx.drawImage(img, 0, 0, cssWidth, cssHeight); };
    img.src = saved;
  }

  let drawing = false;
  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }
  function applyToolStyle() {
    if ((state.scratchTool||'pen') === 'eraser') {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.lineWidth = 22;
    } else {
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = state.scratchColor || '#222';
      ctx.lineWidth = 2.5;
    }
  }
  function saveSnapshot() {
    if (!state.notes) state.notes = {};
    state.notes[qid] = canvas.toDataURL('image/png');
  }
  canvas.onpointerdown = (e) => {
    drawing = true;
    applyToolStyle();
    const p = getPos(e);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    try { canvas.setPointerCapture(e.pointerId); } catch(err) {}
  };
  canvas.onpointermove = (e) => {
    if (!drawing) return;
    const p = getPos(e);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  };
  function endStroke() {
    if (!drawing) return;
    drawing = false;
    saveSnapshot();
  }
  canvas.onpointerup = endStroke;
  canvas.onpointercancel = endStroke;
  canvas.onpointerleave = endStroke;

  const penBtn = document.getElementById('toolPenBtn');
  const eraserBtn = document.getElementById('toolEraserBtn');
  penBtn.onclick = () => { state.scratchTool = 'pen'; penBtn.classList.add('active'); eraserBtn.classList.remove('active'); };
  eraserBtn.onclick = () => { state.scratchTool = 'eraser'; eraserBtn.classList.add('active'); penBtn.classList.remove('active'); };
  document.getElementById('toolClearBtn').onclick = () => {
    ctx.clearRect(0, 0, cssWidth, cssHeight);
    saveSnapshot();
  };
  document.querySelectorAll('.color-btn').forEach(btn => {
    btn.onclick = () => {
      state.scratchColor = btn.dataset.color;
      state.scratchTool = 'pen';
      document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      penBtn.classList.add('active');
      eraserBtn.classList.remove('active');
    };
  });
  const loadGraphBtn = document.getElementById('loadGraphBtn');
  if (loadGraphBtn) {
    loadGraphBtn.onclick = async () => {
      const hasContent = !!(state.notes && state.notes[qid]);
      if (hasContent) {
        const ok = await showConfirm('필기장에 그래프를 불러오면 기존에 그린 내용 위에 그래프가 덮어씌워집니다. 계속할까요?');
        if (!ok) return;
      }
      const img = new Image();
      img.onload = () => {
        ctx.clearRect(0, 0, cssWidth, cssHeight);
        const scale = Math.min(cssWidth / img.width, cssHeight / img.height, 1);
        const w = img.width * scale, h = img.height * scale;
        const x = (cssWidth - w) / 2, y = (cssHeight - h) / 2;
        ctx.drawImage(img, x, y, w, h);
        saveSnapshot();
      };
      img.src = imageUrl;
    };
  }
}

async function finishQuiz() {
  let correctCount = 0;
  const starts = Object.values(state.qStart).filter(Boolean);
  const startedAt = starts.length ? Math.min(...starts) : Date.now();
  const detail = state.questions.map(q => {
    const picked = state.picks[q.id];
    const isCorrect = picked === q.answer;
    if (isCorrect) correctCount++;
    const qStart = state.qStart[q.id] || null;
    const answeredAt = state.qAnsweredAt[q.id] || null;
    const durationSec = (qStart && answeredAt) ? Math.round((answeredAt - qStart)/1000) : null;
    return {
      id: q.id, text: q.text, choices: q.choices, image: q.image || null,
      picked, answer: q.answer, correct: isCorrect,
      answeredAt, durationSec
    };
  });
  const record = {
    name: state.name, subject: state.subject, unit: state.unit, ts: Date.now(), startedAt,
    date: new Date().toISOString().slice(0,10), total: state.questions.length, correct: correctCount, detail
  };
  await saveResult(state.name, record);
  await clearProgress(state.name);
  state = { view: 'result', name: state.name, subject: state.subject, record };
  render();
}

function renderResult() {
  const el = document.getElementById('app');
  const r = state.record;
  const pct = Math.round((r.correct / r.total) * 100);
  const wrongCount = r.total - r.correct;
  el.innerHTML = `

      <div class="result-score">${r.correct} / ${r.total}</div>
      <div class="result-sub">${escapeHtml(r.subject)} · ${escapeHtml(r.unit)} · 정답률 ${pct}%</div>

            <td>${['①','②','③','④','⑤'][d.answer]}</td>
            <td class="${d.correct?'correct':'wrong'}">${d.correct?'정답':'오답'}</td>
          </tr>`).join('')}

function renderTeacherLogin() {
  const el = document.getElementById('app');
  el.innerHTML = `
    <h1>선생님 로그인</h1>
    <div class="sub">비밀번호를 입력하세요 (처음이라면 새로 설정됩니다)</div>
    <div class="card">
      <input id="passInput" type="password" placeholder="비밀번호" />
      <div class="err" id="teacherErr" style="display:none;"></div>
      <button class="primary" id="teacherLoginBtn">입장</button>
      <button class="secondary" id="backToLoginBtn">학생 로그인으로</button>
    </div>
  `;
  document.getElementById('teacherLoginBtn').onclick = async () => {
    const pass = document.getElementById('passInput').value;
    const errEl = document.getElementById('teacherErr');
    if (!pass) { errEl.textContent = '비밀번호를 입력해주세요.'; errEl.style.display='block'; return; }
    const auth = await getTeacherAuth();
    if (!auth) { await setTeacherAuth(pass); }
    else if (auth.pass !== pass) { errEl.textContent = '비밀번호가 일치하지 않습니다.'; errEl.style.display='block'; return; }
    state = { view: 'teacher' };
    render();
  };
  document.getElementById('backToLoginBtn').onclick = () => { state = { view: 'login' }; render(); };
  document.getElementById('passInput').onkeydown = e => { if (e.key==='Enter') document.getElementById('teacherLoginBtn').click(); };
}

  const subjectNames = getOrderedSubjects(bank, meta);

      const pass = await showPrompt('선생님 비밀번호를 입력하세요', true);
      if (pass === null) return;
      if (!(await checkTeacherPass(pass))) { await showAlert('비밀번호가 일치하지 않습니다.'); return; }
      if (!(await showConfirm(`"${name}" 학생 계정을 삭제할까요? (기존 응시 기록은 남아있습니다)`))) return;
      const ok = await deleteStudentAccount(name);
      if (!ok) { await showAlert('삭제에 실패했습니다.'); return; }
      if (studentNotes[name]) {
        const notes = await loadStudentNotes();
        delete notes[name];
        await window.storage.set(STUDENT_NOTES_KEY, JSON.stringify(notes), true);
      }
      renderTeacher();
    };
  });
  document.querySelectorAll('.student-edit-btn').forEach(btn => {
    btn.onclick = () => {
      state.editingStudentNote = btn.dataset.name;
      renderTeacher();
    };
  });
  const noteSaveBtn = document.getElementById('noteSaveBtn');
  if (noteSaveBtn) noteSaveBtn.onclick = async () => {
    const name = state.editingStudentNote;
    const newPass = document.getElementById('notePassInput').value;
    const school = document.getElementById('noteSchoolInput').value.trim();
    const memo = document.getElementById('noteMemoInput').value.trim();
    const errEl = document.getElementById('noteErr');
    errEl.style.display = 'none';
    if (newPass) {
      if (newPass.length < 2) {
        errEl.textContent = '비밀번호는 2자 이상 입력해주세요.';
        errEl.style.display = 'block';
        return;
      }
      const pass = await showPrompt('선생님 비밀번호를 입력하세요', true);
      if (pass === null) return;
      if (!(await checkTeacherPass(pass))) { await showAlert('비밀번호가 일치하지 않습니다.'); return; }
      await setStudentAuth(name, newPass);
    }
    const ok = await saveStudentNote(name, { school, memo });
    if (!ok) { await showAlert('메모 저장에 실패했습니다.'); return; }
    state.editingStudentNote = null;
    renderTeacher();
  };
  const noteCancelBtn = document.getElementById('noteCancelBtn');
  if (noteCancelBtn) noteCancelBtn.onclick = () => {
    state.editingStudentNote = null;
    renderTeacher();
  };

  // ---- 결과 탭/검색 이벤트 ----
  document.getElementById('resultsTabAll').onclick = () => { state.resultsTab = 'all'; renderTeacher(); };
  document.getElementById('resultsTabSearch').onclick = () => { state.resultsTab = 'search'; renderTeacher(); };
  const filterSubjectSelect = document.getElementById('filterSubjectSelect');
  if (filterSubjectSelect) filterSubjectSelect.onchange = (e) => {
    state.filterSubject = e.target.value; state.filterUnit = ''; renderTeacher();
  };
  const filterUnitSelect = document.getElementById('filterUnitSelect');
  if (filterUnitSelect) filterUnitSelect.onchange = (e) => {
    state.filterUnit = e.target.value; renderTeacher();
  };
  document.querySelectorAll('.name-link').forEach(el2 => {
    el2.onclick = () => {
      const idx = parseInt(el2.dataset.idx);
      state.detailRecord = filteredResults[idx];
      state.view = 'studentDetail';
      render();
    };
  });
  const resultsExpandBtn = document.getElementById('resultsExpandBtn');
  if (resultsExpandBtn) resultsExpandBtn.onclick = () => {
    state.resultsExpanded = !state.resultsExpanded;
    renderTeacher();
  };

  // ---- 과목 선택 이벤트 ----
  const subjectSelect = document.getElementById('subjectSelect');
  const newSubjectBox = document.getElementById('newSubjectBox');
  const newSubjectInput = document.getElementById('newSubjectInput');
  if (subjectSelect.value === '__new__') newSubjectBox.style.display = 'block';
  subjectSelect.onchange = () => {
    if (subjectSelect.value === '__new__') { newSubjectBox.style.display = 'block'; newSubjectInput.focus(); }
    else { state.uploadSubject = subjectSelect.value; state.uploadUnit = null; renderTeacher(); }
  };
  document.getElementById('createSubjectOnlyBtn').onclick = async () => {
    const name = newSubjectInput.value.trim();
    if (!name) { await showAlert('과목명을 입력해주세요.'); return; }
    const m = await loadMeta();
    if (!m[name]) m[name] = [];
    if (!m.__subjectOrder) m.__subjectOrder = getOrderedSubjects(bank, meta);
    if (!m.__subjectOrder.includes(name)) m.__subjectOrder.push(name);
    await saveMeta(m);
    state.uploadSubject = name; state.uploadUnit = null;
    renderTeacher();
  };

  // ---- 단원 선택 이벤트 ----
  const unitSelect = document.getElementById('unitSelect');
  const newUnitBox = document.getElementById('newUnitBox');
  const newUnitInput = document.getElementById('newUnitInput');
  unitSelect.onchange = () => {
    if (unitSelect.value === '__new__') { newUnitBox.style.display = 'block'; newUnitInput.focus(); }
    else { newUnitBox.style.display = 'none'; state.uploadUnit = unitSelect.value; }
  };
  const createUnitOnlyBtn = document.getElementById('createUnitOnlyBtn');
  if (createUnitOnlyBtn) createUnitOnlyBtn.onclick = async () => {
    const name = newUnitInput.value.trim();
    if (!uploadSubject) { await showAlert('먼저 과목을 선택하거나 생성해주세요.'); return; }
    if (!name) { await showAlert('단원명을 입력해주세요.'); return; }
    const m = await loadMeta();
    if (!m[uploadSubject]) m[uploadSubject] = [];
    if (!m[uploadSubject].includes(name)) m[uploadSubject].push(name);
    await saveMeta(m);
    state.uploadUnit = name;
    renderTeacher();
  };

  // ---- 과목/단원 삭제 ----
  const deleteSubjectBtn = document.getElementById('deleteSubjectBtn');
  if (deleteSubjectBtn) deleteSubjectBtn.onclick = async () => {
    const target = uploadSubject;
    const pass = await showPrompt('선생님 비밀번호를 입력하세요', true);
    if (pass === null) return;
    if (!(await checkTeacherPass(pass))) { await showAlert('비밀번호가 일치하지 않습니다.'); return; }
    if (!await showConfirm(`"${target}" 과목과 그 안의 모든 단원/문제를 삭제할까요? 되돌릴 수 없습니다.`)) return;
    try {
      const newBank = bank.filter(q => (q.subject||'기타') !== target);
      const ok = await saveBank(newBank, bank);
      if (!ok) return;
      const m = await loadMeta();
      delete m[target];
      if (m.__subjectOrder) m.__subjectOrder = m.__subjectOrder.filter(s => s !== target);
      await saveMeta(m);
      state.uploadSubject = null; state.uploadUnit = null; state.viewSubject = null; state.viewUnit = null; state.orderSubject = null;
      renderTeacher();
    } catch(e) {
      await showAlert('삭제 중 오류가 발생했습니다: ' + (e && e.message ? e.message : e));
    }
  };
  const deleteUnitBtn = document.getElementById('deleteUnitBtn');
  if (deleteUnitBtn) deleteUnitBtn.onclick = async () => {
    const targetSubject = uploadSubject, targetUnit = uploadUnit;
    const pass = await showPrompt('선생님 비밀번호를 입력하세요', true);
    if (pass === null) return;
    if (!(await checkTeacherPass(pass))) { await showAlert('비밀번호가 일치하지 않습니다.'); return; }
    if (!await showConfirm(`"${targetSubject} > ${targetUnit}" 단원의 모든 문제를 삭제할까요? 되돌릴 수 없습니다.`)) return;
    try {
      const newBank = bank.filter(q => !((q.subject||'기타')===targetSubject && (q.unit||'기타')===targetUnit));
      const ok = await saveBank(newBank, bank);
      if (!ok) return;
      const m = await loadMeta();
      if (m[targetSubject]) m[targetSubject] = m[targetSubject].filter(u => u !== targetUnit);
      await saveMeta(m);
      state.uploadUnit = null;
      renderTeacher();
    } catch(e) {
      await showAlert('삭제 중 오류가 발생했습니다: ' + (e && e.message ? e.message : e));
    }
  };

  // ---- 업로드 ----
  document.getElementById('uploadBtn').onclick = async () => {
    const errEl = document.getElementById('uploadErr');
    const okEl = document.getElementById('uploadOk');
    errEl.style.display = 'none'; okEl.style.display = 'none';

    const subjectVal = (subjectSelect.value === '__new__') ? newSubjectInput.value.trim() : subjectSelect.value;
    const unitVal = (unitSelect.value === '__new__') ? newUnitInput.value.trim() : unitSelect.value;
    const fileInput = document.getElementById('fileInput');

    if (!subjectVal || !unitVal) { errEl.textContent = '과목명과 단원명을 입력해주세요.'; errEl.style.display='block'; return; }
    if (!fileInput.files.length) { errEl.textContent = '업로드할 JSON 파일을 선택해주세요.'; errEl.style.display='block'; return; }

    try {
      const text = await fileInput.files[0].text();
      const parsed = JSON.parse(text);
      if (!Array.isArray(parsed)) throw new Error('최상위는 배열([...])이어야 합니다.');
      const maxId = bank.reduce((m,q)=>Math.max(m,q.id||0), 0);
      const batchId = 'b' + Date.now();
      const batchLabel = fileInput.files[0].name;
      const withIds = parsed.map((q,i)=>({
        id: maxId+i+1, subject: subjectVal, unit: unitVal,
        text: q.text, choices: q.choices, answer: q.answer, image: q.image || null,
        batchId, batchLabel, uploadedAt: Date.now()
      }));
      const result = await saveBank(bank.concat(withIds), bank);
      if (!result) throw new Error('저장에 실패했습니다. 이 파일 하나의 용량이 너무 크면(특히 이미지가 많이 포함된 경우) 실패할 수 있습니다. 파일을 나눠서 다시 업로드해보세요.');
      const m = await loadMeta();
      if (!m.__subjectOrder) m.__subjectOrder = getOrderedSubjects(bank, meta);
      if (!m.__subjectOrder.includes(subjectVal)) m.__subjectOrder.push(subjectVal);
      if (!m[subjectVal]) m[subjectVal] = getOrderedUnits(bank, meta, subjectVal);
      if (!m[subjectVal].includes(unitVal)) m[subjectVal].push(unitVal);
      await saveMeta(m);
      okEl.textContent = `${withIds.length}개 문제가 "${subjectVal} > ${unitVal}"에 추가되었습니다.`;
      okEl.style.display = 'block';
      state.uploadSubject = subjectVal; state.uploadUnit = unitVal;
      state.viewSubject = subjectVal; state.viewUnit = unitVal;
      setTimeout(renderTeacher, 900);
    } catch(e) {
      errEl.textContent = '파일을 처리할 수 없습니다: ' + e.message;
      errEl.style.display = 'block';
    }
  };

  // ---- 업로드 기록(배치) 펼치기/접기 ----
  const batchExpandBtn = document.getElementById('batchExpandBtn');
  if (batchExpandBtn) batchExpandBtn.onclick = () => {
    state.batchExpanded = !state.batchExpanded;
    renderTeacher();
  };

  // ---- 과목/단원 순서 관리 ----
  const orderMgmtHeader = document.getElementById('orderMgmtHeader');
  if (orderMgmtHeader) orderMgmtHeader.onclick = () => {
    state.orderMgmtOpen = !state.orderMgmtOpen;
    renderTeacher();
  };
  const orderSubjectSelect = document.getElementById('orderSubjectSelect');
  if (orderSubjectSelect) orderSubjectSelect.onchange = (e) => {
    state.orderSubject = e.target.value;
    renderTeacher();
  };
  document.querySelectorAll('.order-subject-up, .order-subject-down').forEach(btn => {
    btn.onclick = async () => {
      const idx = parseInt(btn.dataset.idx);
      const swapIdx = btn.classList.contains('order-subject-up') ? idx - 1 : idx + 1;
      const arr = subjectNames.slice();
      if (swapIdx < 0 || swapIdx >= arr.length) return;
      [arr[idx], arr[swapIdx]] = [arr[swapIdx], arr[idx]];
      const m = await loadMeta();
      m.__subjectOrder = arr;
      await saveMeta(m);
      renderTeacher();
    };
  });
  document.querySelectorAll('.order-unit-up, .order-unit-down').forEach(btn => {
    btn.onclick = async () => {
      const idx = parseInt(btn.dataset.idx);
      const swapIdx = btn.classList.contains('order-unit-up') ? idx - 1 : idx + 1;
      const arr = orderUnitNames.slice();
      if (swapIdx < 0 || swapIdx >= arr.length) return;
      [arr[idx], arr[swapIdx]] = [arr[swapIdx], arr[idx]];
      const m = await loadMeta();
      m[orderSubject] = arr;
      await saveMeta(m);
      renderTeacher();
    };
  });

  // ---- 업로드 기록(배치) 삭제 ----
  document.querySelectorAll('.batch-del-btn').forEach(btn => {
    btn.onclick = async () => {
      const batchKey = btn.dataset.batchkey;
      const pass = await showPrompt('선생님 비밀번호를 입력하세요', true);
      if (pass === null) return;
      if (!(await checkTeacherPass(pass))) { await showAlert('비밀번호가 일치하지 않습니다.'); return; }
      const count = bank.filter(q => batchKeyOf(q) === batchKey).length;
      if (!await showConfirm(`이 파일로 업로드된 문제 ${count}개를 모두 삭제할까요? 되돌릴 수 없습니다.`)) return;
      try {
        const newBank = bank.filter(q => batchKeyOf(q) !== batchKey);
        const ok = await saveBank(newBank, bank);
        if (!ok) return;
        renderTeacher();
      } catch(e) {
        await showAlert('삭제 중 오류가 발생했습니다: ' + (e && e.message ? e.message : e));
      }
    };
  });

  // ---- 미리보기 필터 ----
  document.getElementById('viewSubjectSelect').onchange = (e) => {
    state.viewSubject = e.target.value; state.viewUnit = null; state.editingQid = null; renderTeacher();
  };
  document.getElementById('viewUnitSelect').onchange = (e) => {
    state.viewUnit = e.target.value; state.editingQid = null; renderTeacher();
  };

  // ---- 문제별 수정/삭제 ----
  bindPreviewItemEvents(bank);

  document.getElementById('clearBtn').onclick = async () => {
    const pass = await showPrompt('선생님 비밀번호를 입력하세요', true);
    if (pass === null) return;
    if (!(await checkTeacherPass(pass))) { await showAlert('비밀번호가 일치하지 않습니다.'); return; }
    if (!await showConfirm('문제은행 전체를 초기화하고 예시 문제로 되돌릴까요?')) return;
    try {
      const ok1 = await saveBank(SEED_QUESTIONS, bank);
      const ok2 = await saveMeta({});
      if (!ok1 || !ok2) return;
      state.uploadSubject = null; state.uploadUnit = null; state.viewSubject = null; state.viewUnit = null;
      renderTeacher();
    } catch(e) {
      await showAlert('초기화 중 오류가 발생했습니다: ' + (e && e.message ? e.message : e));
    }
  };
  document.getElementById('backBtn').onclick = () => { state = { view: 'login' }; render(); };
  renderMath();
}

function batchKeyOf(q) {
  return q.batchId || ('legacy:' + (q.subject||'') + ':' + (q.unit||''));
}

function renderBatchList(bank, expanded) {
  const groups = {};
  bank.forEach(q => {
    const key = batchKeyOf(q);
    if (!groups[key]) {
      groups[key] = {
        key,
        label: q.batchLabel || '(파일 정보 없음 · 이전 데이터)',
        subject: q.subject || '기타',
        unit: q.unit || '기타',
        uploadedAt: q.uploadedAt || null,
        count: 0
      };
    }
    groups[key].count++;
  });
  const list = Object.values(groups).sort((a,b) => (b.uploadedAt||0) - (a.uploadedAt||0));
  if (list.length === 0) return '<div class="empty">업로드 기록이 없습니다</div>';
  const shown = expanded ? list : list.slice(0, 5);
  return `
    <table>
      <tr><th>파일</th><th>과목</th><th>단원</th><th>문항수</th><th>업로드 시각</th><th></th></tr>
      ${shown.map(g => `
        <tr>
          <td>${escapeHtml(g.label)}</td>
          <td>${escapeHtml(g.subject)}</td>
          <td>${escapeHtml(g.unit)}</td>
          <td>${g.count}</td>
          <td>${g.uploadedAt ? fmtDateTime(g.uploadedAt) : '-'}</td>
          <td><button class="mini danger-mini batch-del-btn" data-batchkey="${escapeHtml(g.key)}" type="button">삭제</button></td>
        </tr>`).join('')}
    </table>
    ${list.length > 5 ? `<button class="secondary mini" id="batchExpandBtn" type="button">${expanded ? '접기' : `상세보기 (전체 ${list.length}건)`}</button>` : ''}
  `;
}

function renderPreviewItem(q, i) {
  const isEditing = state.editingQid === q.id;
  if (!isEditing) {
    return `
      <div class="preview-item" data-qid="${q.id}">
        <div class="phead">
          <span class="pnum">${escapeHtml(q.unit||'')} · Q${i+1}</span>
          <span class="phead-btns">
            <button class="mini edit-btn" data-qid="${q.id}" type="button">수정하기</button>
            <button class="mini danger-mini del-btn" data-qid="${q.id}" type="button">삭제하기</button>
          </span>
        </div>
        <div class="ptext">${escapeHtml(q.text)}</div>
        ${q.image ? `<img class="pimg" src="${q.image}" alt="문제 그림" />` : ''}
        ${(q.choices||[]).map((c,ci)=>`
          <div class="pchoice ${ci===q.answer?'pcorrect':''}">${['①','②','③','④','⑤'][ci]||(ci+1)} ${escapeHtml(c)} ${ci===q.answer?'✓':''}</div>
        `).join('')}
      </div>
    `;
  }
  const draft = state.editDraft;
  return `
    <div class="preview-item" data-qid="${q.id}">
      <div class="phead"><span class="pnum">${escapeHtml(q.unit||'')} · Q${i+1} (수정 중)</span></div>
      <label class="fl">문제 내용</label>
      <textarea id="editText">${escapeHtml(draft.text)}</textarea>
      ${q.image ? `<img class="pimg" src="${q.image}" alt="문제 그림" /><div class="hint">그림은 그대로 유지됩니다 (그림 수정은 지원하지 않음).</div>` : ''}
      <label class="fl">보기 (정답 라디오로 선택)</label>
      ${draft.choices.map((c,ci)=>`
        <div class="edit-choice-row">
          <input type="radio" name="editAnswer" value="${ci}" ${draft.answer===ci?'checked':''}>
          <input type="text" data-ci="${ci}" class="editChoice" value="${escapeHtml(c)}">
        </div>
      `).join('')}
      <div class="row2">
        <button class="primary" id="saveEditBtn" type="button">저장</button>
        <button class="secondary" id="cancelEditBtn" type="button" style="margin-top:0;">취소</button>
      </div>
    </div>
  `;
}

function bindPreviewItemEvents(bank) {
  document.querySelectorAll('.edit-btn').forEach(btn => {
    btn.onclick = () => {
      const qid = parseInt(btn.dataset.qid);
      const q = bank.find(x => x.id === qid);
      if (!q) return;
      state.editingQid = qid;
      state.editDraft = { text: q.text, choices: [...q.choices], answer: q.answer };
      renderTeacher();
    };
  });
  document.querySelectorAll('.del-btn').forEach(btn => {
    btn.onclick = async () => {
      const qid = parseInt(btn.dataset.qid);
      if (!await showConfirm('이 문제를 삭제할까요?')) return;
      try {
        const newBank = bank.filter(q => q.id !== qid);
        const ok = await saveBank(newBank, bank);
        if (!ok) return;
        renderTeacher();
      } catch(e) {
        await showAlert('삭제 중 오류가 발생했습니다: ' + (e && e.message ? e.message : e));
      }
    };
  });
  const saveEditBtn = document.getElementById('saveEditBtn');
  if (saveEditBtn) saveEditBtn.onclick = async () => {
    const text = document.getElementById('editText').value.trim();
    const choiceInputs = document.querySelectorAll('.editChoice');
    const choices = Array.from(choiceInputs).map(inp => inp.value.trim());
    const answerRadio = document.querySelector('input[name="editAnswer"]:checked');
    if (!text || choices.some(c => !c) || !answerRadio) {
      await showAlert('문제 내용, 모든 보기, 정답을 모두 입력/선택해주세요.');
      return;
    }
    const answer = parseInt(answerRadio.value);
    const qid = state.editingQid;
    try {
      const newBank = bank.map(q => q.id === qid ? { ...q, text, choices, answer } : q);
      const ok = await saveBank(newBank, bank);
      if (!ok) return;
      state.editingQid = null; state.editDraft = null;
      renderTeacher();
    } catch(e) {
      await showAlert('저장 중 오류가 발생했습니다: ' + (e && e.message ? e.message : e));
    }
  };
  const cancelEditBtn = document.getElementById('cancelEditBtn');
  if (cancelEditBtn) cancelEditBtn.onclick = () => {
    state.editingQid = null; state.editDraft = null;
    renderTeacher();
  };
}

// ---------- teacher: student detail ----------
function renderStudentDetail() {
  const el = document.getElementById('app');
  const r = state.detailRecord;
  const pct = Math.round((r.correct / r.total) * 100);
  const totalDur = r.startedAt ? Math.round((r.ts - r.startedAt)/1000) : null;

  el.innerHTML = `
    <div class="crumb">${escapeHtml(r.subject||'-')} · ${escapeHtml(r.unit||'-')}</div>
    <h1>${escapeHtml(r.name)}님 결과 상세</h1>
    <div class="sub">
      응시일 ${fmtDateTime(r.ts)} · 점수 ${r.correct}/${r.total} (${pct}%) ${totalDur!==null?`· 총 소요시간 ${fmtDuration(totalDur)}`:''}
    </div>
    ${(r.detail||[]).map((d,i)=>`
      <div class="card">
        <div class="dq-meta">Q${i+1} · 푼 시각 ${fmtDateTime(d.answeredAt)} · 소요시간 ${fmtDuration(d.durationSec)}${d.picked==='unknown'?' · <span style="color:#c23434;">모르겠음으로 표시함</span>':''}</div>
        <div class="qtext" style="font-size:15px;">${escapeHtml(d.text)}</div>
        ${d.image ? `<img class="dimg" src="${d.image}" alt="문제 그림" />` : ''}
        ${(d.choices||[]).map((c,ci)=>`
          <div class="dchoice">
            <span>${['①','②','③','④','⑤'][ci]||(ci+1)}</span>
            <span class="${ci===d.answer?'d-answer-mark':''} ${ci===d.picked?'d-picked-mark':''}">${escapeHtml(c)}</span>
            ${ci===d.picked?'<span>✓ 선택함</span>':''}
          </div>
        `).join('')}
      </div>
    `).join('')}
    <button class="secondary" id="backBtn">목록으로</button>
  `;
  document.getElementById('backBtn').onclick = () => { state.view = 'teacher'; render(); };
}

render();
</script>
</body>
</html>
